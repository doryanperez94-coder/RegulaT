<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RegulaT - Acceso Alumnos</title>
  <link rel="stylesheet" href="estilos_index.css">
  <link rel="stylesheet" href="estilos_logins.css">
</head>
<body class="body-login">

  <div class="login-container-3d">
    <div class="login-card-3d">
      <div class="card-glow"></div>
      <div class="login-header">
        <span class="logo-icon"></span>
        <h2>Portal del Alumno</h2>
        <p>Ingresa tus credenciales para acceder a tus asignaturas y evaluaciones</p>
      </div>

      <form id="formLoginAlumno" onsubmit="procesarLoginAlumno(event)">
        <div class="form-group-3d">
          <label>Usuario o Matrícula:</label>
          <input type="text" id="inputUsuarioAlumno" class="input-3d" placeholder="••••••••" required>
        </div>
        <div class="form-group-3d">
          <label>Contraseña:</label>
          <input type="password" id="inputPassAlumno" class="input-3d" placeholder="••••••••" required>
        </div>
        <div id="errorLoginAlumno" class="error-badge" style="display:none;">Usuario o contraseña no encontrados en la matriculación</div>
        <button type="submit" class="btn-3d btn-primary btn-block">Ingresar a Mis Materias</button>
      </form>
      <a href="index.html" class="link-volviendo">&larr; Volver al inicio</a>
    </div>
  </div>

  <script src="script_index.js"></script>
  <script src="script_logins.js"></script>
</body>
</html>
